<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运营配置助手 · 总版 V2</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#20242b;background:#f6f7f9;font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}.home{max-width:1120px;margin:0 auto;padding:42px}.home h1{margin:0 0 8px;font-size:28px}.home>p{margin:0;color:#667085}.flow{margin-top:28px;background:#fff;border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:220px 1fr auto;align-items:center;gap:20px;padding:20px 22px;border-bottom:1px solid #e4e7eb}.row:last-child{border-bottom:0}.row strong{font-size:16px}.row span{color:#667085}.row a{padding:8px 13px;border-radius:7px;color:#fff;background:#c91420;text-decoration:none;font-weight:700}.row.list a{color:#2869ad;background:#eef5fc}.tag{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;color:#a90a13!important;background:#fff1f2;font-size:11px;font-weight:700}@media(max-width:760px){.home{padding:24px 18px}.row{grid-template-columns:1fr}.row a{width:max-content}}
  </style>
</head>
<body>
  <main class="home">
    <h1>商品与营销配置总览</h1>
    <p>三个操作页面负责执行任务，两个业务清单负责快速定位并跳转。</p>
    <section class="flow">
      <div class="row"><strong>优惠券配置</strong><span>配置优惠方式、适用商品、专业范围和有效期。</span><a href="总版_优惠券配置.html">进入配置</a></div>
      <div class="row"><strong>商品课程上下架</strong><span>按项目、专业和商品范围执行批量上下架。</span><a href="总版_商品课程上下架.html">进入操作</a></div>
      <div class="row"><strong>商品调价</strong><span>选择商品并统一调整价格，保留确认和操作记录。</span><a href="总版_商品调价.html">进入操作</a></div>
      <div class="row list"><strong>全部项目清单<span class="tag">本期新增</span></strong><span>从完整业务地图定位项目、专业和对应商品。</span><a href="总版_全部项目清单.html">查看清单</a></div>
      <div class="row list"><strong>临床商品清单<span class="tag">本期新增</span></strong><span>聚焦临床业务商品，便于快速查找和后续操作。</span><a href="总版_临床商品清单.html">查看清单</a></div>
    </section>
  </main>
  <script src="总版外壳.js"></script>
</body>
</html>
