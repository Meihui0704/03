  function openZone(row){state.editing=row||null;const v=row||{};const chosenProjects=String(v.project||'').split('、');const chosenProfessions=String(v.profession||'').split('、');const projectChecks=projects.map(p=>'<label class="check-chip"><input name="zoneProjects" type="checkbox" value="'+esc(p.name)+'" '+(chosenProjects.includes(p.name)?'checked':'')+'> '+esc(p.name)+'</label>').join('');const professionChecks=projects.flatMap(p=>p.professions).map(x=>'<label class="check-chip"><input name="zoneProfessions" type="checkbox" value="'+esc(x)+'" '+(chosenProfessions.includes(x)?'checked':'')+'> '+esc(x)+'</label>').join('');const icon=v.iconUrl?'<img src="'+esc(v.iconUrl)+'" alt="当前入口图标">':esc(v.icon||v.name?.slice(0,1)||'图');modal(row?'编辑入口':'新增入口','<section class="step"><div class="step-head"><h2>入口样式与位置</h2><p>金刚区和磁片区在这里统一选择，不再拆成两个管理页面。</p></div><div class="form-grid"><div class="field full"><label class="required">显示应用</label><div class="radio-cards"><button class="radio-card '+(v.app!=='昭昭医考小程序'?'active':'')+'" type="button" data-zone-app="昭昭医考App">昭昭医考App</button><button class="radio-card '+(v.app==='昭昭医考小程序'?'active':'')+'" type="button" data-zone-app="昭昭医考小程序">昭昭医考小程序</button></div></div><div class="field full"><label class="required">显示页面与位置</label><div class="radio-cards"><button class="radio-card '+(v.position!=='磁片区'?'active':'')+'" type="button" data-zone-position="金刚区">首页 · 金刚区</button><button class="radio-card '+(v.position==='磁片区'?'active':'')+'" type="button" data-zone-position="磁片区">首页 · 磁片区</button></div></div><div class="field full"><label class="required">入口名称</label><input id="zoneName" class="control" maxlength="8" value="'+esc(v.name||'')+'"><span class="note">前台空间有限，建议 2–6 个字。</span></div><div class="field full"><label class="required">入口图标</label><div class="icon-editor"><div id="iconPreview" class="icon-preview">'+icon+'</div><div><label class="btn" for="iconFile">选择 80×80 图片</label><input id="iconFile" class="hidden" type="file" accept="     if(a==='preview'){previewDestination(rows.find(r=>r.id===+b.dataset.id));return}if(a==='preview-configure'){const row=rows.find(r=>r.id===+b.dataset.id);closeModal();openDestination(row);return}if(a==='toggle'){const row=rows.find(r=>r.id===+b.dataset.id);if(row.status==='OFF'&&!hasDestination(row)){showToast('该入口尚未配置完整去向，补齐后才能启用');openDestination(row);return}confirmBox('确认'+(row.status==='ON'?'停用':'启用'),row.status==='ON'?'停用后前台不再显示此入口。':'已检查到明确点击去向；提交时还会校验位置和有效期冲突。','confirm-toggle',row.id);return}if(a==='bulk-on'){const chosen=rows.filter(r=>state.selected.has(r.id)),invalid=chosen.filter(r=>!hasDestination(r));if(invalid.length){modal('批量启用前需要补充配置','<p>以下 '+invalid.length+' 条入口没有完整点击去向，不能启用：</p><div class="warning">'+invalid.map(r=>esc(r.position+' · '+r.name)).join('<br>')+'</div>','<button class="btn" data-action="close-modal">返回修改</button>','small');return}confirmBox('确认批量启用','已选择 '+chosen.length+' 条；系统将继续检查同页面、位置、专业和有效期冲突。','confirm-bulk','ON');return}
    if(a==='toggle-category')$('#categoryPanel').classList.toggle('hidden');else if(a==='toggle-advanced')$('#advancedPanel').classList.toggle('hidden');else if(a==='create'){state.zoneIconUrl='';openZone()}else if(a==='close-modal')closeModal();else if(a==='reset'){state.project='';state.profession='';state.position='ALL';$('#search').value='';$('#appFilter').value='';$('#pageFilter').value='';$$('#positionTabs button').forEach(x=>x.classList.toggle('active',x.dataset.listPosition==='ALL'));renderCategories();render()}else if(b.dataset.listPosition){state.position=b.dataset.listPosition;$$('#positionTabs button').forEach(x=>x.classList.toggle('active',x===b));render()}else if(b.dataset.zoneApp){$$('[data-zone-app]').forEach(x=>x.classList.toggle('active',x===b))}else if(b.dataset.zonePosition){$$('[data-zone-position]').forEach(x=>x.classList.toggle('active',x===b))}else if(a==='check-all-projects'){const boxes=$$('input[name="zoneProjects"]'),all=boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);b.textContent=all?'全选项目':'取消全选'}else if(a==='check-all-professions'){const boxes=$$('input[name="zoneProfessions"]'),all=boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);b.textContent=all?'全选专业':'取消全选'}else if(b.dataset.status){state.status=b.dataset.status;$$('#statusTabs button').forEach(x=>x.classList.toggle('active',x===b));$('#offRange').classList.toggle('hidden',state.status!=='OFF');render()}else if(b.dataset.range){state.range=b.dataset.range;$$('#offRange button').forEach(x=>x.classList.toggle('active',x===b));render()}else if(b.dataset.project!==undefined){state.project=b.dataset.project;state.profession='';renderCategories();render()}else if(b.dataset.profession!==undefined){state.profession=b.dataset.profession;renderCategories();render()}else if(a==='select-all'){const data=filtered(),all=data.every(r=>state.selected.has(r.id));data.forEach(r=>all?state.selected.delete(r.id):state.selected.add(r.id));render()}else if(a==='destination')openDestination(rows.find(r=>r.id===+b.dataset.id));else if(a==='edit'){const r=rows.find(r=>r.id===+b.dataset.id);state.zoneIconUrl=r.iconUrl||'';openZone(r)}else if(a==='copy')openCopy(rows.find(r=>r.id===+b.dataset.id));else if(a==='toggle'){const r=rows.find(x=>x.id===+b.dataset.id);confirmBox('确认'+(r.status==='ON'?'停用':'启用'),r.status==='ON'?'停用后前台不再显示此入口。':'启用前将检查同页面、位置、专业和有效期冲突。','confirm-toggle',r.id)}else if(a==='delete'){const r=rows.find(x=>x.id===+b.dataset.id);confirmBox('确认删除','删除“'+r.name+'”后可在页面提示中撤回。','confirm-delete',r.id)}else if(a==='bulk-on'||a==='bulk-off')confirmBox('确认批量操作','将处理已选择的 '+state.selected.size+' 条记录；启用前逐条检查冲突。','confirm-bulk',a==='bulk-on'?'ON':'OFF');else if(a==='bulk-delete')confirmBox('批量删除警告','将删除已选择的 '+state.selected.size+' 条记录。','confirm-bulk-delete');
    else if(a==='save-zone-only')saveZone(false);else if(a==='save-zone-next')saveZone(true)
    else if(b.dataset.mode){state.destination.mode=b.dataset.mode;state.destination.page='';state.destination.selected=null;renderDestination()}else if(a==='search-content'){const q=($('#contentKeyword')?.value||'').toLowerCase();const list=contentPool.filter(x=>(x.name+x.id).toLowerCase().includes(q));$('#resultList').innerHTML=list.map(x=>'<label class="result-item"><input type="radio" name="content" data-content="'+x.id+'"><div><strong>'+esc(x.name)+'</strong><span>ID '+x.id+' · '+esc(x.project)+' · '+esc(x.profession)+'</span></div></label>').join('')||'<div class="empty">没有匹配内容</div>'}else if(b.dataset.content){state.destination.selected=contentPool.find(x=>x.id===b.dataset.content);renderDestination()}else if(a==='clear-content'){state.destination.selected=null;renderDestination()}else if(a==='save-destination')commitDestination()
    else if(b.dataset.copy){state.copyCount=+b.dataset.copy;$$('[data-copy]').forEach(x=>x.classList.toggle('active',x===b))}else if(a==='confirm-copy'){const created=[];for(let i=0;i<state.copyCount;i++){const r={...state.copy,id:Date.now()%100000+i,name:state.copy.name+'（副本'+(i+1)+'）',status:'OFF',offAt:'2026-09-02',updatedBy:'美惠',updatedAt:'刚刚'};rows.unshift(r);created.push(r.id)}state.deleted={type:'copy',ids:created};closeModal();state.status='OFF';$$('#statusTabs button').forEach(x=>x.classList.toggle('active',x.dataset.status==='OFF'));$('#offRange').classList.remove('hidden');render();showToast('已复制 '+created.length+' 条，可在“今天停用”中查看。',true)}
    else if(a==='confirm-toggle'){const r=rows.find(x=>x.id===+b.dataset.id);r.status=r.status==='ON'?'OFF':'ON';r.offAt=r.status==='OFF'?'2026-09-02':'';closeModal();render();showToast(r.status==='ON'?'已启用并通过冲突校验':'已停用')}else if(a==='confirm-bulk'){const s=b.dataset.id;rows.filter(r=>state.selected.has(r.id)).forEach(r=>{r.status=s;r.offAt=s==='OFF'?'2026-09-02':''});state.selected.clear();closeModal();render();showToast('批量操作完成')}else if(a==='confirm-delete'){const id=+b.dataset.id,old=rows.find(x=>x.id===id);state.deleted={type:'delete',items:[old]};rows=rows.filter(x=>x.id!==id);closeModal();render();showToast('已删除 1 条。',true)}else if(a==='confirm-bulk-delete'){const items=rows.filter(r=>state.selected.has(r.id));state.deleted={type:'delete',items};rows=rows.filter(r=>!state.selected.has(r.id));state.selected.clear();closeModal();render();showToast('已删除 '+items.length+' 条。',true)}else if(a==='undo'){if(state.deleted?.type==='copy')rows=rows.filter(r=>!state.deleted.ids.includes(r.id));if(state.deleted?.type==='delete')rows.unshift(...state.deleted.items);state.deleted=null;$('#toastRoot').innerHTML='';render();showToast('已撤回上一项操作')}else if(a==='close-toast')$('#toastRoot').innerHTML='';
  });
