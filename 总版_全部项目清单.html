<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全业务线 · 批量勾选总览</title>
<style>
  :root{
    --jade:#1F8A6E;
    --jade-dark:#166350;
    --jade-tint:#E4F2EC;
    --blue:#4A90E2;
    --text:#2B2B2B;
    --muted:#8A8A8A;
    --line:#E3E3E3;
    --brand:#D7000F;
    --brand-dark:#A3000C;
    --brand-tint:#FBE7E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:#F5F6F7;color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}

  .brand-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .brand-header img{height:34px;display:block;}
  .brand-header .sep{width:1px;height:22px;background:var(--line);}
  .brand-header .page-name{font-size:13px;color:var(--muted);font-weight:600;}

  .intro-banner{
    background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);
    border-radius:8px;padding:14px 18px;margin-bottom:16px;font-size:12.5px;line-height:1.75;
  }
  .intro-banner .row{display:flex;gap:8px;margin-bottom:4px;}
  .intro-banner .row:last-child{margin-bottom:0;}
  .intro-banner .label{flex-shrink:0;font-weight:800;color:var(--text);width:78px;}
  .intro-banner .val{color:var(--muted);}
  .intro-banner .task{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .intro-banner .task .val{color:var(--jade-dark);font-weight:700;}

  .summary-bar{
    display:flex;justify-content:space-between;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:12px 18px;margin-bottom:16px;font-size:12.5px;
  }
  .summary-bar b{color:var(--jade-dark);}
  .summary-actions{display:flex;gap:8px;}
  .btn-plain{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 14px;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap;}
  .btn-plain:hover{border-color:var(--muted);}

  .cat-card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .cat-header{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none;}
  .cat-header:hover{background:#FAFAFA;}
  .cat-checkbox{width:16px;height:16px;accent-color:var(--jade);cursor:pointer;flex-shrink:0;}
  .cat-name{font-size:13.5px;font-weight:700;color:var(--text);flex-shrink:0;}
  .cat-count{font-size:11.5px;color:var(--muted);}
  .cat-progress{font-size:11px;color:var(--jade-dark);font-weight:600;margin-left:auto;margin-right:8px;}
  .cat-arrow{font-size:12px;color:var(--muted);transition:transform .2s;flex-shrink:0;}
  .cat-arrow.open{transform:rotate(180deg);}
  .cat-body{display:none;padding:0 16px 14px 16px;border-top:1px solid var(--line);}
  .cat-body.open{display:block;}

  .item-list{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;}
  .item-chip{
    display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;
    border:1px solid var(--line);background:#FBFBFA;font-size:12px;cursor:pointer;transition:.15s;
  }
  .item-chip:hover{border-color:var(--jade);}
  .item-chip.checked{background:var(--jade-tint);border-color:var(--jade);color:var(--jade-dark);font-weight:600;}
  .item-chip input{width:13px;height:13px;accent-color:var(--jade);pointer-events:none;}

  .sub-tag-row{display:flex;flex-wrap:wrap;gap:7px;padding-top:10px;margin-bottom:8px;}
  .sub-tag{
    padding:6px 12px;border-radius:16px;border:1.3px solid var(--jade);background:#fff;
    font-size:12px;font-weight:600;color:var(--jade-dark);cursor:pointer;transition:.15s;
  }
  .sub-tag:hover{background:var(--jade-tint);}
  .sub-tag.active{background:var(--jade);color:#fff;}
  .sub-tag .cnt{opacity:.8;font-weight:500;margin-left:3px;}
  .highlight-note{
    font-size:11px;color:var(--jade-dark);background:var(--jade-tint);border-radius:6px;
    padding:6px 10px;margin-top:8px;margin-bottom:4px;font-weight:600;
  }
  .sub-group-header{font-size:11px;color:var(--muted);font-weight:700;margin:10px 0 4px;padding-top:6px;border-top:1px dashed var(--line);}
  .sub-group-header:first-child{border-top:none;padding-top:0;}
</style>
</head>

<script>
const taxonomy = {
  "临床": ["临床执业医师","临床助理医师"],
  "西医": ["西医考研","西医考研—复试","规培结业考核（共30科）","期末考试（共4科）","申硕—西医综合","西医副高职称（共47科）","临床三基","临床医学专业／本科水平测试"],
  "中级职称": {
    "内科类": ["全科主治(301)","全科医学中医类(302)","内科主治(303)","心内主治(304)","呼吸主治(305)","消化主治(306)","肾内主治(307)","神内主治(308)","内分泌主治(309)","血液主治(310)","传染病主治(312)","风湿免疫主治(313)","中医内科(315)","中西医结合内科(316)"],
    "外科类": ["普外主治(317)","骨外主治(318)","胸心外主治(319)","神外主治(320)","泌外主治(321)","小儿外主治(322)","烧伤外主治(323)","整形外主治(324)","中医外科(325)","中西医结合外科(326)"],

  },
  "中医／中西医": ["中医执业／助理医师","中医考研","中西医执业／助理医师","中级职称（共10科）","规培结业考核（共2科）","规培出科考核（共9科）","期末考试（中医，共4科）","期末考试（中西医，共4科）","中医师承及确有专长","中医适宜技术"],
  "乡村全科": ["乡村全科助理"],
  "口腔": ["口腔执业医师","口腔执业助理医师","中级职称（共1科）","期末考试（口腔，共4科）","口腔规培结业考核（共7科）","口腔考研"],
  "公卫预防": ["公卫执业医师","公卫助理医师","中级职称（共5科）","期末考试（公卫，共4科）","公卫考研"],
  "护理": ["护士执业","护士资格","护理三基","初级护师","护理考研","主管护师（共6科）","专科期末（护理，共2科）","本科期末（护理，共3科）","护理专升本（统招，共4科）"],
  "中医传承": ["中医传承"],
  "中西药": ["考研（共2科）","初级职称（共4科）","中级职称（共2科）","期末考试（西药，共4科）","期末考试（中药，共4科）"],
  "医学技术": ["医技初级职称（士，共7科）","医技初级职称（师，共7科）","医学初级职称（师，共1科）","医技中级职称（主管，共15科）"],
  "医疗招聘": ["临床考编","中医考编","口腔考编","预防医学考编","护理考编","药学考编","中药学考编","检验考编","康复考编","影像考编"],
  "过敏": ["变态反应学"]
};

const checkedSet = new Set();
const openCats = new Set(["中级职称"]);

function isNested(val){ return !Array.isArray(val); }

function categoryTotal(name){
  const val = taxonomy[name];
  if(isNested(val)) return Object.values(val).flat().length;
  return val.length;
}
function categorySelectedCount(name){
  let n = 0;
  checkedSet.forEach(id=>{ if(id.startsWith(name + '::')) n++; });
  return n;
}
function grandTotal(){
  return Object.keys(taxonomy).reduce((sum,name)=> sum + categoryTotal(name), 0);
}

const catList = document.getElementById('catList');

function render(){
  catList.innerHTML = '';
  Object.entries(taxonomy).forEach(([catName, val])=>{
    const total = categoryTotal(catName);
    const selected = categorySelectedCount(catName);
    const isOpen = openCats.has(catName);
    const allChecked = selected === total && total > 0;

    const card = document.createElement('div');
    card.className = 'cat-card';

    const header = document.createElement('div');
    header.className = 'cat-header';
    header.innerHTML = `
      <input type="checkbox" class="cat-checkbox" ${allChecked ? 'checked' : ''}>
      <span class="cat-name">${catName}</span>
      <span class="cat-count">(${total}个)</span>
      <span class="cat-progress">${selected > 0 ? `已选 ${selected}` : ''}</span>
      <span class="cat-arrow ${isOpen ? 'open' : ''}">⌄</span>
    `;
    header.querySelector('.cat-checkbox').addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleCategoryAll(catName, !allChecked);
    });
    header.addEventListener('click', ()=>{
      if(openCats.has(catName)) openCats.delete(catName);
      else openCats.add(catName);
      render();
    });
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = `cat-body ${isOpen ? 'open' : ''}`;

    if(isNested(val)){
      body.innerHTML = `<div class="highlight-note">🆕 该分类下新增「按科室分组」批量勾选（原本需在下方逐个专业勾选，共${total}个）</div>`;
      const tagRow = document.createElement('div');
      tagRow.className = 'sub-tag-row';
      Object.entries(val).forEach(([subGroup, items])=>{
        const tag = document.createElement('div');
        tag.className = 'sub-tag';
        tag.innerHTML = `${subGroup}<span class="cnt">(${items.length})</span>`;
        tag.addEventListener('click', ()=>{
          tag.classList.toggle('active');
          const nowActive = tag.classList.contains('active');
          items.forEach((item,i)=>{
            setTimeout(()=> toggleItem(catName, item, nowActive), i*30);
          });
        });
        tagRow.appendChild(tag);
      });
      body.appendChild(tagRow);

      Object.entries(val).forEach(([subGroup, items])=>{
        const subHeader = document.createElement('div');
        subHeader.className = 'sub-group-header';
        subHeader.textContent = subGroup;
        body.appendChild(subHeader);
        const list = document.createElement('div');
        list.className = 'item-list';
        items.forEach(item=>{
          list.appendChild(buildItemChip(catName, item));
        });
        body.appendChild(list);
      });
    } else {
      const list = document.createElement('div');
      list.className = 'item-list';
      val.forEach(item=>{
        list.appendChild(buildItemChip(catName, item));
      });
      body.appendChild(list);
    }

    card.appendChild(body);
    catList.appendChild(card);
  });

  updateSummary();
}

function buildItemChip(catName, item){
  const id = `${catName}::${item}`;
  const chip = document.createElement('div');
  chip.className = 'item-chip' + (checkedSet.has(id) ? ' checked' : '');
  chip.innerHTML = `<input type="checkbox" ${checkedSet.has(id) ? 'checked' : ''}><span>${item}</span>`;
  chip.addEventListener('click', ()=> toggleItem(catName, item, !checkedSet.has(id)));
  return chip;
}

function toggleItem(catName, item, on){
  const id = `${catName}::${item}`;
  if(on) checkedSet.add(id); else checkedSet.delete(id);
  render();
}

function toggleCategoryAll(catName, on){
  const val = taxonomy[catName];
  const items = isNested(val) ? Object.values(val).flat() : val;
  items.forEach(item=>{
    const id = `${catName}::${item}`;
    if(on) checkedSet.add(id); else checkedSet.delete(id);
  });
  render();
}

function updateSummary(){
  document.getElementById('totalCount').textContent = checkedSet.size;
  document.getElementById('grandTotal').textContent = grandTotal();
  let catsWithSelection = 0;
  Object.keys(taxonomy).forEach(name=>{ if(categorySelectedCount(name) > 0) catsWithSelection++; });
  document.getElementById('catCount').textContent = catsWithSelection;
}

document.getElementById('expandAllBtn').addEventListener('click', ()=>{
  Object.keys(taxonomy).forEach(name=> openCats.add(name));
  render();
});
document.getElementById('collapseAllBtn').addEventListener('click', ()=>{
  openCats.clear();
  render();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  checkedSet.clear();
  render();
});

render();
</script>
<script src="总版外壳.js"></script></body>
</html>
