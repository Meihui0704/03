<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营配置助手 · AI工具集管理 V1</title>
<style>
:root{--red:#c91420;--red-soft:#fff1f2;--ink:#20242b;--muted:#667085;--line:#e4e7eb;--bg:#f7f8fa;--blue:#2869ad;--green:#147a62;--green-soft:#eaf6f1;--shadow:0 4px 8px rgba(24,32,43,.11)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.5 "PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.topbar{height:64px;padding:0 24px;display:flex;align-items:center;gap:18px;background:#fff;border-bottom:1px solid var(--line)}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:#fff;background:var(--red);font-weight:800}.brand{font-size:16px;font-weight:760}.meta{color:var(--muted)}.operator{margin-left:auto;color:var(--muted);font-size:12px}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{padding:22px 14px;background:#fbfbfc;border-right:1px solid var(--line)}.aside-title{padding:0 10px 14px;color:#858990;font-size:12px}.nav{display:flex;flex-direction:column;gap:4px}.nav a,.nav button{display:block;min-height:42px;padding:10px 12px;border:0;border-radius:8px;color:var(--muted);background:transparent;text-align:left;text-decoration:none;font-weight:600}.nav a:hover,.nav button:hover{background:#f0f2f4}.nav .active{color:#a90a13;background:var(--red-soft)}main{width:100%;max-width:1480px;margin:0 auto;padding:32px 40px 56px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.head h1{margin:0 0 6px;font-size:26px}.head p{margin:0;color:var(--muted)}.btn{min-height:40px;padding:8px 14px;border:1px solid #d2d7dd;border-radius:7px;color:#303844;background:#fff;font-weight:600}.btn:hover{background:#f8fafc}.btn.primary{color:#fff;border-color:var(--red);background:var(--red)}.btn.text{min-height:32px;padding:4px 6px;border:0;color:var(--blue);background:transparent}.btn.danger{color:#bc2430}.toolbar{display:flex;align-items:center;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}.search{width:min(360px,38vw);height:40px;padding:0 12px;border:1px solid #d2d7dd;border-radius:7px;background:#fff}.segments{display:flex;padding:2px;border:1px solid #dde1e6;border-radius:8px;background:#fff}.segments button{min-height:34px;padding:6px 13px;border:0;border-radius:6px;color:#56606d;background:transparent}.segments button.active{color:#a90a13;background:var(--red-soft);font-weight:700}.count{margin-left:auto;color:var(--muted);font-size:13px}.intro{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}.intro h2{margin:0;font-size:17px}.intro span{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:12px}.card{min-height:230px;padding:18px;border:1px solid var(--line);border-radius:10px;background:#fff}.card.off{color:#737b86;background:#f4f5f6}.card-head{display:flex;align-items:flex-start;gap:12px}.icon{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:10px;color:#9f121c;background:#fff0f1;font-size:20px;font-weight:800}.card h3{margin:1px 0 3px;font-size:16px}.id{color:var(--muted);font-size:12px}.status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;color:var(--green);background:var(--green-soft);font-size:12px;font-weight:700}.status:before{width:6px;height:6px;border-radius:50%;background:currentColor;content:""}.off .status{color:#667085;background:#e5e8eb}.desc{height:43px;margin:14px 0 12px;color:#596271}.facts{display:flex;gap:18px;padding:11px 0;border-top:1px solid #eef0f2;border-bottom:1px solid #eef0f2}.fact b,.fact span{display:block}.fact b{font-size:15px}.fact span{color:var(--muted);font-size:11px}.actions{display:flex;align-items:center;gap:7px;margin-top:12px}.actions .more{margin-left:auto}.empty{padding:70px;text-align:center;color:var(--muted)}.backdrop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:rgba(18,24,31,.44)}.hidden{display:none!important}.modal{width:min(620px,96vw);max-height:90vh;overflow:auto;padding:22px;border-radius:12px;background:#fff}.modal h2{margin:0 0 5px;font-size:20px}.modal>p{margin:0 0 18px;color:var(--muted)}.field{display:grid;gap:6px;margin-top:13px}.field label{font-weight:700}.field input,.field textarea{width:100%;padding:10px 11px;border:1px solid #cfd5dc;border-radius:7px}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.warning{padding:12px;border-radius:8px;color:#7a5400;background:#fff7df}.toast{position:fixed;right:22px;bottom:22px;z-index:50;padding:12px 14px;border-radius:8px;color:#164f3e;background:#e8f6f0;box-shadow:var(--shadow)}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(260px,1fr))}main{padding:26px 24px}}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}.head,.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.count{margin-left:0}}
</style></head><body><header class="topbar"><div class="mark">昭</div><div class="brand">运营配置助手</div><span class="meta">· 运营管理</span><div class="operator">当前操作人：美惠</div></header><div class="shell"><aside><div class="aside-title">运营管理</div><div class="nav"><a href="运营配置助手_轮播图管理_V1.html">广告素材管理</a><a href="运营配置助手_金刚区管理_V1.html">金刚区管理</a><a class="active" href="运营配置助手_AI工具集管理_V1.html">AI 工具集管理</a><button data-coming>活动管理</button><button data-coming>反馈管理</button><button data-coming>App 优惠券管理</button><button data-coming>App 免费体验课管理</button><button data-coming>App 商品推荐管理</button></div></aside><main><div class="head"><div><h1>AI 工具集管理</h1><p>管理 App 中部的6个智能体入口；数量固定，重点维护顺序、状态和运营配置。</p></div></div><div class="toolbar"><input id="search" class="search" placeholder="搜索工具名称或 ID"><div class="segments"><button class="active" data-status="ON">使用中</button><button data-status="OFF">已停用</button><button data-status="ALL">全部</button></div><span id="count" class="count"></span></div><div class="intro"><h2>App 智能体入口</h2><span>按 App 展示顺序排列 · 可直接编辑序号</span></div><div id="grid" class="grid"></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<style>.config-list{display:grid;gap:10px;margin-top:16px}.config-item{display:grid;grid-template-columns:1fr auto;gap:5px 16px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left}.config-item span{grid-column:1;color:var(--muted);font-size:12px}.config-item b{grid-row:1/3;grid-column:2;color:var(--blue)}.manage-list{display:grid;margin-top:14px;border:1px solid var(--line);border-radius:9px;overflow:hidden}.manage-row{display:grid;grid-template-columns:34px 1fr auto auto;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}.manage-row:last-child{border-bottom:0}.num{color:var(--muted)}.pill{padding:4px 8px;border-radius:999px;color:var(--green);background:var(--green-soft);font-size:12px}.empty-panel{margin-top:16px;padding:42px 20px;border:1px dashed #ccd2d9;border-radius:9px;color:var(--muted);text-align:center}</style>
<script>
let tools=[{id:25,order:0,name:'医学知识问答',desc:'面向医学知识场景的智能问答入口',free:3,status:'ON',modifiedBy:'刘磊',modifiedAt:'2026-05-19 18:15'},{id:24,order:1,name:'拍照解题',desc:'拍摄医学试题后识别并辅助解析',free:3,status:'ON',modifiedBy:'刘磊',modifiedAt:'2026-05-19 18:11'},{id:20,order:2,name:'技能手册',desc:'查看缝合、穿刺、急救等技能内容',free:3,status:'ON',modifiedBy:'张旭',modifiedAt:'2026-04-16 10:43'},{id:18,order:3,name:'写简历',desc:'辅助整理医学岗位求职简历',free:3,status:'ON',modifiedBy:'张旭',modifiedAt:'2026-04-16 10:44'},{id:23,order:4,name:'找工作',desc:'匹配医学岗位与招聘信息',free:3,status:'ON',modifiedBy:'张旭',modifiedAt:'2026-04-16 10:45'},{id:19,order:5,name:'调剂查询',desc:'查询医学考研调剂相关信息',free:3,status:'ON',modifiedBy:'张旭',modifiedAt:'2026-04-17 15:19'}],status='ON',editing=null;const $=s=>document.querySelector(s);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('#toastRoot').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toastRoot').innerHTML='',3500)}function render(){const q=$('#search').value.trim().toLowerCase(),data=tools.filter(x=>(status==='ALL'||x.status===status)&&(!q||(x.name+x.id).toLowerCase().includes(q))).sort((a,b)=>a.order-b.order);$('#count').textContent=data.length+' / 6 个';$('#grid').innerHTML=data.map(x=>'<article class="card '+(x.status==='OFF'?'off':'')+'"><div class="card-head"><div class="icon">'+esc(x.name.slice(0,1))+'</div><div><h3>'+esc(x.name)+'</h3><div class="id">工具 ID '+x.id+' · 排序 '+x.order+'</div></div><span class="status">'+(x.status==='ON'?'启用':'已停用')+'</span></div><p class="desc">'+esc(x.desc)+'</p><div class="facts"><div class="fact"><b>'+x.free+'</b><span>免费次数</span></div><div class="fact"><b>'+esc(x.modifiedBy)+'</b><span>'+esc(x.modifiedAt)+' 修改</span></div></div><div class="actions"><button class="btn text" data-edit="'+x.id+'">编辑</button><button class="btn text" data-toggle="'+x.id+'">'+(x.status==='ON'?'停用':'启用')+'</button><button class="btn text more" data-config="'+x.id+'">运营配置</button></div></article>').join('')||'<div class="empty">没有匹配的 AI 工具</div>'}function modal(title,body,foot){$('#modalRoot').innerHTML='<div class="backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2>'+body+'<div class="modal-actions"><button class="btn" data-close>取消</button>'+foot+'</div></div></div>'}function edit(id){editing=tools.find(x=>x.id===id);modal('编辑 AI 工具','<p>调整 App 中展示的信息、排序和免费次数。</p><div class="field"><label>名称</label><input id="name" value="'+esc(editing.name)+'"></div><div class="field"><label>简介</label><textarea id="desc">'+esc(editing.desc)+'</textarea></div><div class="field"><label>App 展示顺序（0–5）</label><input id="order" type="number" min="0" max="5" value="'+editing.order+'"></div><div class="field"><label>每位用户免费次数</label><input id="free" type="number" min="0" value="'+editing.free+'"></div>','<button class="btn primary" data-save>保存</button>')}function confirmToggle(id){const x=tools.find(t=>t.id===id);modal('确认'+(x.status==='ON'?'停用':'启用'),'<p>'+esc(x.name)+' · 工具 ID '+x.id+'</p><div class="warning">'+(x.status==='ON'?'停用后，App 中该智能体入口将不可使用。':'启用后，App 用户将可以进入该智能体。')+'</div>','<button class="btn primary" data-confirm="'+x.id+'">确认</button>')}function config(id){const x=tools.find(t=>t.id===id);modal(x.name+' · 运营配置','<p>以下配置均与该智能体绑定，接入后读取真实数据。</p><div class="field"><button class="btn" data-sub="问题管理">问题管理</button><button class="btn" data-sub="营销管理">营销管理</button><button class="btn" data-sub="推荐管理">推荐管理</button></div>','<button class="btn primary" data-close>完成</button>')}document.addEventListener('click',e=>{const b=e.target.closest('button,[data-edit],[data-toggle],[data-config]');if(!b)return;if(b.dataset.status){status=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active',x===b));render()}else if(b.dataset.edit)edit(+b.dataset.edit);else if(b.dataset.toggle)confirmToggle(+b.dataset.toggle);else if(b.dataset.config)config(+b.dataset.config);else if(b.hasAttribute('data-close'))$('#modalRoot').innerHTML='';else if(b.hasAttribute('data-save')){const order=Math.max(0,Math.min(5,+$('#order').value));const clash=tools.find(x=>x!==editing&&x.order===order);if(clash){toast('排序 '+order+' 已被“'+clash.name+'”使用，请选择其他序号');return}Object.assign(editing,{name:$('#name').value.trim(),desc:$('#desc').value.trim(),order,free:Math.max(0,+$('#free').value),modifiedBy:'美惠',modifiedAt:'刚刚'});$('#modalRoot').innerHTML='';render();toast('AI 工具配置已保存')}else if(b.dataset.confirm){const x=tools.find(t=>t.id===+b.dataset.confirm);x.status=x.status==='ON'?'OFF':'ON';x.modifiedBy='美惠';x.modifiedAt='刚刚';$('#modalRoot').innerHTML='';render();toast('“'+x.name+'”已'+(x.status==='ON'?'启用':'停用'))}else if(b.dataset.sub)toast('已进入“'+b.dataset.sub+'”配置入口');else if(b.hasAttribute('data-coming'))toast('该模块将在对应页面接入后开放')});$('#search').addEventListener('input',render);render();
let questions=['拍道题，帮我解','帮我分析这道题','帮我看看这个病理图','这道笔试题怎么做？'],marketing=[{type:'免费',period:'2026-05-19 至 2026-05-30',status:'启用'}],currentTool=null;
config=function(id){currentTool=tools.find(t=>t.id===id);modal(currentTool.name+' · 运营配置','<p>管理这个智能体在 App 内的引导和权益。</p><div class="config-list"><button class="config-item" data-panel="questions"><strong>问题管理</strong><span>App 展示的 4 个推荐提问，降低首次使用门槛</span><b>'+questions.length+' 条 ›</b></button><button class="config-item" data-panel="marketing"><strong>营销管理</strong><span>免费、会员、分享或白名单权益及有效期</span><b>'+marketing.length+' 条 ›</b></button><button class="config-item" data-panel="recommend"><strong>推荐管理</strong><span>关联商品；当前后台尚未配置内容</span><b>未配置 ›</b></button></div>','<button class="btn primary" data-close>完成</button>')};
function openQuestions(){modal(currentTool.name+' · 问题管理','<p>这是 App 直接展示的推荐提问，不是用户历史问题。</p><div class="manage-list">'+questions.map((q,i)=>'<div class="manage-row"><span class="num">'+(i+1)+'</span><strong>'+esc(q)+'</strong><span class="pill">启用</span><button class="btn text danger" data-qdelete="'+i+'">删除</button></div>').join('')+'</div><div class="field"><label>新增推荐提问</label><input id="newQuestion" maxlength="40" placeholder="输入 App 展示文案"></div>','<button class="btn" data-config="'+currentTool.id+'">返回</button><button class="btn primary" data-qadd>添加</button>')}
function openMarketing(){modal(currentTool.name+' · 营销管理','<p>配置用户可获得的使用权益与生效时间。</p><div class="manage-list">'+marketing.map((m,i)=>'<div class="manage-row"><span class="num">'+(i+1)+'</span><strong>'+esc(m.type)+'<small style="display:block;color:var(--muted);font-weight:400">'+esc(m.period)+'</small></strong><span class="pill">'+esc(m.status)+'</span><button class="btn text" data-medit="'+i+'">编辑</button></div>').join('')+'</div>','<button class="btn" data-config="'+currentTool.id+'">返回</button><button class="btn primary" data-madd>添加</button>')}
function editMarketing(i){const m=marketing[i]||{type:'免费',period:'',status:'启用'};modal((i>=0?'编辑':'新增')+'营销配置','<div class="field"><label>权益类型</label><select id="mtype" class="search" style="width:100%"><option>免费</option><option>会员</option><option>分享</option><option>白名单</option></select></div><div class="field"><label>有效期</label><input id="mperiod" value="'+esc(m.period)+'" placeholder="开始日期 至 结束日期"></div>','<button class="btn" data-panel="marketing">返回</button><button class="btn primary" data-msave="'+i+'">保存</button>');$('#mtype').value=m.type}
function openRecommendation(){modal(currentTool.name+' · 推荐管理','<p>用于关联该智能体内推荐的商品。</p><div class="empty-panel"><strong>暂未关联商品</strong><br><span>未获得真实商品数据前不生成示例内容</span></div>','<button class="btn" data-config="'+currentTool.id+'">返回</button><button class="btn primary" data-close>完成</button>')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-panel],[data-qadd],[data-qdelete],[data-medit],[data-madd],[data-msave]');if(!b)return;if(b.dataset.panel==='questions')openQuestions();else if(b.dataset.panel==='marketing')openMarketing();else if(b.dataset.panel==='recommend')openRecommendation();else if(b.hasAttribute('data-qadd')){const v=$('#newQuestion').value.trim();if(!v)return toast('请先输入推荐提问');questions.push(v);openQuestions();toast('推荐提问已添加；请通过排序决定 App 展示顺序')}else if(b.dataset.qdelete!==undefined){questions.splice(+b.dataset.qdelete,1);openQuestions();toast('推荐提问已删除')}else if(b.dataset.medit!==undefined)editMarketing(+b.dataset.medit);else if(b.hasAttribute('data-madd'))editMarketing(-1);else if(b.dataset.msave!==undefined){const item={type:$('#mtype').value,period:$('#mperiod').value.trim(),status:'启用'},i=+b.dataset.msave;if(!item.period)return toast('请填写有效期');if(i>=0)marketing[i]=item;else marketing.push(item);openMarketing();toast('营销配置已保存')}});
</script></body></html>
