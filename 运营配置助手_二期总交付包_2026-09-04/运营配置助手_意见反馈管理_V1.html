<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营配置助手 · 意见反馈管理 V1</title><style>
:root{--red:#c91420;--ink:#20242b;--muted:#667085;--line:#e4e7eb;--bg:#f7f8fa;--blue:#2869ad;--green:#147a62;--green-soft:#eaf6f1;--amber:#956800;--amber-soft:#fff7df}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.topbar{height:64px;padding:0 24px;display:flex;align-items:center;gap:18px;background:#fff;border-bottom:1px solid var(--line)}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:#fff;background:var(--red);font-weight:800}.brand{font-size:16px;font-weight:760}.meta,.operator,.sub{color:var(--muted)}.operator{margin-left:auto;font-size:12px}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{padding:22px 14px;background:#fbfbfc;border-right:1px solid var(--line)}.aside-title{padding:0 10px 14px;color:#858990;font-size:12px}.nav{display:flex;flex-direction:column;gap:4px}.nav a,.nav button{display:block;min-height:42px;padding:10px 12px;border:0;border-radius:8px;color:var(--muted);background:transparent;text-align:left;text-decoration:none;font-weight:600}.nav a:hover,.nav button:hover{background:#f0f2f4}.nav .active{color:#a90a13;background:#fff1f2}main{width:100%;max-width:1480px;margin:0 auto;padding:32px 40px 56px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.head h1{margin:0 0 6px;font-size:26px}.summary{display:flex;gap:8px}.chip{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted)}.chip b{color:var(--ink)}.filters{display:grid;grid-template-columns:1.4fr repeat(3,minmax(130px,.7fr)) auto auto;gap:10px;padding:16px;background:#fff;border-bottom:1px solid var(--line)}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cfd5dc;border-radius:7px;color:var(--ink);background:#fff}.btn{min-height:40px;padding:8px 14px;border:1px solid #d2d7dd;border-radius:7px;color:#303844;background:#fff;font-weight:600}.btn:hover{background:#f8fafc}.btn.primary{color:#fff;border-color:var(--red);background:var(--red)}.btn.text{min-height:32px;padding:4px 5px;border:0;color:var(--blue);background:transparent}.list{background:#fff}.row{display:grid;grid-template-columns:minmax(280px,1.5fr) 150px 170px 160px 160px;gap:22px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.row.header{padding-block:12px;color:var(--muted);font-size:12px;font-weight:700;background:#fafbfc}.message strong{display:block;margin-bottom:5px}.message p{max-width:70ch;margin:0;color:#596271;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user,.time{color:var(--muted);font-size:12px}.tag,.state{display:inline-flex;width:max-content;padding:4px 8px;border-radius:999px;font-size:12px}.tag{color:#4d5968;background:#eef1f4}.state.pending{color:var(--amber);background:var(--amber-soft)}.state.done{color:var(--green);background:var(--green-soft)}.empty{padding:70px;text-align:center;color:var(--muted)}.backdrop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:rgba(18,24,31,.44)}.modal{width:min(640px,96vw);max-height:90vh;overflow:auto;padding:22px;border-radius:12px;background:#fff}.modal h2{margin:0 0 5px}.detail{display:grid;grid-template-columns:100px 1fr;gap:10px;margin:18px 0}.detail dt{color:var(--muted)}.detail dd{margin:0}.field{display:grid;gap:6px;margin-top:14px}.field label{font-weight:700}.field textarea{min-height:110px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;z-index:50;padding:12px 14px;border-radius:8px;color:#164f3e;background:#e8f6f0;box-shadow:0 4px 8px rgba(24,32,43,.11)}@media(max-width:1050px){main{padding:26px 24px}.filters{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 130px 150px}.row>*:nth-child(3),.row>*:nth-child(4){display:none}}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{display:none}.head{align-items:flex-start;flex-direction:column;gap:12px}.filters{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row>*:nth-child(2),.row>*:nth-child(3),.row>*:nth-child(4){display:none}}
</style></head><body><header class="topbar"><div class="mark">昭</div><div class="brand">运营配置助手</div><span class="meta">· 运营管理</span><div class="operator">当前操作人：美惠</div></header><div class="shell"><aside><div class="aside-title">运营管理</div><nav class="nav"><a href="运营配置助手_轮播图管理_V1.html">广告素材管理</a><a href="运营配置助手_金刚区管理_V1.html">金刚区管理</a><a href="运营配置助手_AI工具集管理_V1.html">AI 工具集管理</a><a class="active" href="运营配置助手_意见反馈管理_V1.html">意见反馈管理</a><button data-coming>活动管理</button><button data-coming>App 优惠券管理</button><button data-coming>App 免费体验课管理</button><button data-coming>App 商品推荐管理</button></nav></aside><main><div class="head"><div><h1>意见反馈管理</h1><p class="sub">接收、处理并回复 App 用户反馈；该模块持续运行，不设置启用或停用。</p></div><div class="summary"><span class="chip">待处理 <b id="pendingCount">0</b></span><span class="chip">全部 <b id="allCount">0</b></span></div></div><section class="filters"><input id="search" placeholder="搜索反馈内容或反馈 ID"><select id="type"><option value="ALL">全部类型</option><option>试题</option><option>书籍</option><option>功能</option></select><select id="platform"><option value="ALL">全部平台</option><option value="Android">Android</option><option value="iOS">iOS</option></select><select id="status"><option value="ALL">全部状态</option><option value="待处理">待处理</option><option value="处理中">处理中</option><option value="已回复">已回复</option><option value="已关闭">已关闭</option></select><button class="btn" id="reset">重置</button><button class="btn primary" id="query">查询</button></section><div class="list"><div class="row header"><span>反馈内容</span><span>类型与平台</span><span>用户</span><span>反馈时间</span><span>处理</span></div><div id="rows"></div></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div><script>
let feedbacks=[{id:8052,type:'试题',platform:'Android',device:'Redmi',version:'8.4.1',user:'用户 6***8',phone:'183****3598',content:'前几天做的题记录没了，笔记也没有找到。',time:'2026-09-02 21:35',status:'待处理',reply:''},{id:8051,type:'试题',platform:'Android',device:'HUAWEI',version:'8.4.0',user:'用户 7***0',phone:'191****5780',content:'模拟考试估分结果无法正常显示。',time:'2026-09-02 14:56',status:'待处理',reply:''},{id:8050,type:'试题',platform:'iOS',device:'iPhone',version:'8.4.0',user:'用户 3***0',phone:'187****3060',content:'试卷页面没有显示标题。',time:'2026-09-02 14:04',status:'处理中',reply:''},{id:8049,type:'书籍',platform:'Android',device:'HONOR',version:'8.4.0',user:'用户 李**',phone:'152****2039',content:'购买的书籍内容无法打开，请协助查看。',time:'2026-09-02 07:34',status:'已回复',reply:'已收到，我们正在核对订单和书籍权限。'},{id:8048,type:'功能',platform:'Android',device:'vivo',version:'8.4.0',user:'用户 7***9',phone:'137****7729',content:'培训入口无法找到，希望能提供更明确的入口。',time:'2026-08-30 19:50',status:'已关闭',reply:'入口位置已说明，用户确认问题解决。'}];
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){$('#toastRoot').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toastRoot').innerHTML='',3200)}function render(){const q=$('#search').value.trim().toLowerCase(),type=$('#type').value,platform=$('#platform').value,status=$('#status').value;const data=feedbacks.filter(x=>(type==='ALL'||x.type===type)&&(platform==='ALL'||x.platform===platform)&&(status==='ALL'||x.status===status)&&(!q||(x.content+x.id).toLowerCase().includes(q)));$('#allCount').textContent=feedbacks.length;$('#pendingCount').textContent=feedbacks.filter(x=>x.status==='待处理').length;$('#rows').innerHTML=data.map(x=>'<article class="row"><div class="message"><strong>#'+x.id+' · '+esc(x.content)+'</strong><p>'+esc(x.device)+' · App '+esc(x.version)+'</p></div><div><span class="tag">'+esc(x.type)+'</span> <span class="tag">'+esc(x.platform)+'</span></div><div><b>'+esc(x.user)+'</b><div class="user">'+esc(x.phone)+'</div></div><div class="time">'+esc(x.time)+'</div><div><span class="state '+(x.status==='待处理'?'pending':'done')+'">'+esc(x.status)+'</span><button class="btn text" data-view="'+x.id+'">查看与回复</button></div></article>').join('')||'<div class="empty">没有符合当前条件的反馈</div>'}function openFeedback(id){const x=feedbacks.find(f=>f.id===id);$('#modalRoot').innerHTML='<div class="backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>反馈 #'+x.id+'</h2><p class="sub">'+esc(x.type)+' · '+esc(x.platform)+' · '+esc(x.device)+' · App '+esc(x.version)+'</p><dl class="detail"><dt>反馈用户</dt><dd>'+esc(x.user)+' · '+esc(x.phone)+'</dd><dt>反馈时间</dt><dd>'+esc(x.time)+'</dd><dt>反馈内容</dt><dd>'+esc(x.content)+'</dd><dt>当前状态</dt><dd><span class="state '+(x.status==='待处理'?'pending':'done')+'">'+esc(x.status)+'</span></dd></dl><div class="field"><label>处理状态</label><select id="editStatus"><option>待处理</option><option>处理中</option><option>已回复</option><option>已关闭</option></select></div><div class="field"><label>回复用户</label><textarea id="reply" placeholder="输入回复内容">'+esc(x.reply)+'</textarea></div><div class="actions"><button class="btn" data-close>取消</button><button class="btn primary" data-save="'+x.id+'">保存处理结果</button></div></div></div>';$('#editStatus').value=x.status}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='query')render();else if(b.id==='reset'){$('#search').value='';$('#type').value=$('#platform').value=$('#status').value='ALL';render()}else if(b.dataset.view)openFeedback(+b.dataset.view);else if(b.hasAttribute('data-close'))$('#modalRoot').innerHTML='';else if(b.dataset.save){const x=feedbacks.find(f=>f.id===+b.dataset.save),reply=$('#reply').value.trim(),next=$('#editStatus').value;if(next==='已回复'&&!reply)return toast('状态为“已回复”时，请填写回复内容');x.status=next;x.reply=reply;$('#modalRoot').innerHTML='';render();toast('反馈处理结果已保存')}else if(b.hasAttribute('data-coming'))toast('该模块将在对应页面接入后开放')});$('#search').addEventListener('keydown',e=>{if(e.key==='Enter')render()});render();
</script></body></html>
