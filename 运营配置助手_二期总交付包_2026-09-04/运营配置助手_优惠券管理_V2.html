<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营配置助手 · 优惠券管理 V2</title><style>
:root{--red:#c91420;--ink:#20242b;--muted:#667085;--line:#e4e7eb;--bg:#f7f8fa;--blue:#2869ad;--green:#147a62;--green-soft:#eaf6f1}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.topbar{height:64px;padding:0 24px;display:flex;align-items:center;gap:18px;background:#fff;border-bottom:1px solid var(--line)}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:#fff;background:var(--red);font-weight:800}.brand{font-size:16px;font-weight:760}.muted,.operator{color:var(--muted)}.operator{margin-left:auto;font-size:12px}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{padding:22px 14px;background:#fbfbfc;border-right:1px solid var(--line)}.nav{display:flex;flex-direction:column;gap:4px}.nav a{min-height:42px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600}.nav a:hover{background:#f0f2f4}.nav .active{color:#a90a13;background:#fff1f2}main{width:100%;max-width:1480px;margin:0 auto;padding:32px 40px 56px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.head h1{margin:0 0 6px;font-size:26px}.btn{min-height:40px;padding:8px 14px;border:1px solid #d2d7dd;border-radius:7px;color:#303844;background:#fff;font-weight:600}.btn.primary{color:#fff;border-color:var(--red);background:var(--red)}.btn.text{min-height:32px;padding:4px 6px;border:0;color:var(--blue);background:transparent}.btn.danger{color:#bc2430}.segments{display:flex;padding:2px;border:1px solid #dde1e6;border-radius:8px;background:#fff}.segments button{padding:7px 14px;border:0;border-radius:6px;color:var(--muted);background:transparent}.segments .active{color:#a90a13;background:#fff1f2;font-weight:700}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.search{width:280px;padding:10px 11px;border:1px solid #cfd5dc;border-radius:7px;background:#fff}.bulk{display:none;align-items:center;gap:8px;padding:10px 14px;margin-bottom:10px;border-radius:8px;background:#f0f4f8}.bulk.show{display:flex}.bulk span{margin-right:auto}.table{overflow:visible;border-radius:10px;background:#fff}.row{display:grid;grid-template-columns:38px minmax(220px,1.2fr) 180px 170px 160px 125px 190px;gap:18px;align-items:center;padding:17px 18px;border-bottom:1px solid var(--line)}.row.header{padding-block:12px;color:var(--muted);font-size:12px;font-weight:700;background:#fafbfc}.name strong,.name span{display:block}.name span,.small{color:var(--muted);font-size:12px}.status{display:inline-flex;width:max-content;padding:5px 9px;border-radius:999px;color:var(--green);background:var(--green-soft);font-size:12px;font-weight:700}.status.off{color:#667085;background:#eceff2}.actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.backdrop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:rgba(18,24,31,.44)}.modal{width:min(560px,96vw);padding:22px;border-radius:12px;background:#fff}.modal h2{margin:0 0 6px}.warning{margin:16px 0;padding:12px;border-radius:8px;color:#7a5400;background:#fff7df}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;z-index:50;padding:12px 14px;border-radius:8px;color:#164f3e;background:#e8f6f0;box-shadow:0 4px 8px rgba(24,32,43,.11)}@media(max-width:1050px){main{padding:26px 24px}.row{grid-template-columns:38px 1fr 150px 130px 180px}.row>*:nth-child(4),.row>*:nth-child(5){display:none}}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{display:none}.head{align-items:flex-start;flex-direction:column;gap:12px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.row{grid-template-columns:30px 1fr auto}.row>*:nth-child(3),.row>*:nth-child(4),.row>*:nth-child(5),.row>*:nth-child(6){display:none}}
</style></head><body><header class="topbar"><div class="mark">昭</div><div class="brand">运营配置助手</div><span class="muted">· 运营管理</span><div class="operator">当前操作人：美惠</div></header><div class="shell"><aside><p class="muted" style="padding:0 10px 10px">运营管理</p><nav class="nav"><a href="运营配置助手_轮播图管理_V1.html">广告素材管理</a><a href="运营配置助手_金刚区管理_V1.html">金刚区管理</a><a href="运营配置助手_AI工具集管理_V1.html">AI 工具集管理</a><a href="运营配置助手_意见反馈管理_V1.html">意见反馈管理</a><a class="active" href="运营配置助手_优惠券管理_V2.html">App 优惠券管理</a><a href="#">App 免费体验课管理</a><a href="#">App 商品推荐管理</a></nav></aside><main><div class="head"><div><h1>App 优惠券管理</h1><p class="muted">二期管理外壳 + 一期批量配置引擎</p></div><button class="btn primary" id="create">新增优惠券</button></div><div class="toolbar"><input id="search" class="search" placeholder="搜索优惠券名称或 ID"><div class="segments"><button class="active" data-status="ON">使用中</button><button data-status="OFF">已下架</button><button data-status="ALL">全部</button></div></div><div id="bulk" class="bulk"><span>已选择 <b id="selectedCount">0</b> 条</span><button class="btn" data-bulk="ON">批量上架</button><button class="btn" data-bulk="OFF">批量下架</button><button class="btn danger" data-bulk="DELETE">批量删除</button></div><section class="table"><div class="row header"><input id="selectAll" type="checkbox"><span>优惠券任务</span><span>优惠方式</span><span>适用范围</span><span>有效期</span><span>状态</span><span>操作</span></div><div id="rows"></div></section></main></div><div id="modalRoot"></div><div id="toastRoot"></div><script>
let status='ON',selected=new Set(),items=[{id:101,name:'中级职称精英班暑期立减券',discount:'满 0 减 980',scope:'19 个专业 · 1 个班型',period:'2026-07-20 至 07-31',state:'ON'},{id:102,name:'内科类阶段优惠券',discount:'8 折',scope:'6 个专业 · 2 个班型',period:'2026-08-01 至 08-15',state:'ON'},{id:103,name:'冲刺班限时直减券',discount:'无门槛减 200',scope:'10 个专业 · 1 个班型',period:'2026-06-01 至 06-10',state:'OFF'}];const $=s=>document.querySelector(s),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){$('#toastRoot').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toastRoot').innerHTML='',3200)}function visible(){const q=$('#search').value.trim().toLowerCase();return items.filter(x=>(status==='ALL'||x.state===status)&&(!q||(x.name+x.id).toLowerCase().includes(q)))}function render(){const data=visible();$('#rows').innerHTML=data.map(x=>'<article class="row"><input type="checkbox" data-check="'+x.id+'" '+(selected.has(x.id)?'checked':'')+'><div class="name"><strong>'+esc(x.name)+'</strong><span>任务 ID '+x.id+'</span></div><strong>'+esc(x.discount)+'</strong><span>'+esc(x.scope)+'</span><span class="small">'+esc(x.period)+'</span><span class="status '+(x.state==='OFF'?'off':'')+'">'+(x.state==='ON'?'使用中':'已下架')+'</span><div class="actions"><button class="btn text" data-edit="'+x.id+'">配置</button><button class="btn text" data-copy="'+x.id+'">复制</button><button class="btn text" data-toggle="'+x.id+'">'+(x.state==='ON'?'下架':'上架')+'</button><button class="btn text danger" data-delete="'+x.id+'">删除</button></div></article>').join('');$('#selectedCount').textContent=selected.size;$('#bulk').classList.toggle('show',selected.size>0);$('#selectAll').checked=data.length>0&&data.every(x=>selected.has(x.id))}function confirmBox(title,text,action){$('#modalRoot').innerHTML='<div class="backdrop"><div class="modal"><h2>'+esc(title)+'</h2><p class="muted">'+esc(text)+'</p><div class="warning">该操作会改变优惠券在 App 中的可用状态，请确认影响范围。</div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" data-confirm="'+action+'">确认</button></div></div></div>'}function openPhase1(){window.open('file:///Users/meihui/Downloads/运营配置助手_demo最终版.html','_blank')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.status){status=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active',x===b));selected.clear();render()}else if(b.id==='create'||b.dataset.edit)openPhase1();else if(b.dataset.copy){const x=items.find(i=>i.id===+b.dataset.copy),copy={...x,id:Math.max(...items.map(i=>i.id))+1,name:x.name+'（复制）',state:'OFF'};items.push(copy);status='OFF';document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active',x.dataset.status==='OFF'));render();toast('已复制到“已下架”，可继续编辑后上架')}else if(b.dataset.toggle){const x=items.find(i=>i.id===+b.dataset.toggle);confirmBox('确认'+(x.state==='ON'?'下架':'上架'),x.name,'toggle:'+x.id)}else if(b.dataset.delete)confirmBox('确认删除',items.find(i=>i.id===+b.dataset.delete).name,'delete:'+b.dataset.delete);else if(b.dataset.bulk)confirmBox(b.dataset.bulk==='DELETE'?'确认批量删除':'确认批量'+(b.dataset.bulk==='ON'?'上架':'下架'),'共 '+selected.size+' 条优惠券任务','bulk:'+b.dataset.bulk);else if(b.hasAttribute('data-close'))$('#modalRoot').innerHTML='';else if(b.dataset.confirm){const [kind,val]=b.dataset.confirm.split(':');if(kind==='toggle'){const x=items.find(i=>i.id===+val);x.state=x.state==='ON'?'OFF':'ON'}if(kind==='delete')items=items.filter(i=>i.id!==+val);if(kind==='bulk'){if(val==='DELETE')items=items.filter(i=>!selected.has(i.id));else items.forEach(i=>{if(selected.has(i.id))i.state=val});selected.clear()}$('#modalRoot').innerHTML='';render();toast('操作已完成')}});document.addEventListener('change',e=>{if(e.target.dataset.check){const id=+e.target.dataset.check;e.target.checked?selected.add(id):selected.delete(id);render()}else if(e.target.id==='selectAll'){visible().forEach(x=>e.target.checked?selected.add(x.id):selected.delete(x.id));render()}});$('#search').addEventListener('input',render);render();
openPhase1=async function(){document.getElementById('modalRoot').innerHTML='<div style="position:fixed;inset:0;z-index:40;background:#fff"><div style="height:58px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #e4e7eb"><strong style="font-size:16px">优惠券批量配置</strong><span class="muted" style="margin-left:10px">保留一期完整配置能力</span><button class="btn" style="margin-left:auto" data-close>返回任务列表</button></div><div class="loading" style="display:grid;place-items:center;height:calc(100vh - 58px);color:#667085">正在加载一期优惠券配置…</div></div>';try{const source=await fetch('/coupon-source.html').then(r=>{if(!r.ok)throw new Error('source');return r.text()}),match=source.match(/"coupon"\s*:\s*"([A-Za-z0-9+/=]+)"/);if(!match)throw new Error('coupon');const bytes=Uint8Array.from(atob(match[1]),c=>c.charCodeAt(0)),html=new TextDecoder().decode(bytes),frame=document.createElement('iframe');frame.title='一期优惠券批量配置';frame.srcdoc=html;frame.style.cssText='display:block;width:100%;height:calc(100vh - 58px);border:0;background:#f7f8fa';document.querySelector('.loading').replaceWith(frame)}catch(err){document.querySelector('.loading').textContent='一期配置加载失败，请刷新后重试。'}};
async function openFullPhase1(){document.getElementById('modalRoot').innerHTML='<div style="position:fixed;inset:0;z-index:40;background:#fff"><div style="height:58px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #e4e7eb"><strong style="font-size:16px">一期完整能力总览</strong><span class="muted" style="margin-left:10px">优惠券配置 · 课程上下架 · 商品调价 · 全业务线总览 · 临床商品清单</span><button class="btn" style="margin-left:auto" data-close>返回优惠券管理</button></div><div class="full-loading" style="display:grid;place-items:center;height:calc(100vh - 58px);color:#667085">正在加载一期完整 Demo…</div></div>';try{const html=await fetch('/coupon-source.html').then(r=>{if(!r.ok)throw new Error('source');return r.text()}),frame=document.createElement('iframe');frame.title='一期运营配置助手完整演示';frame.srcdoc=html;frame.style.cssText='display:block;width:100%;height:calc(100vh - 58px);border:0;background:#f7f8fa';document.querySelector('.full-loading').replaceWith(frame)}catch(err){document.querySelector('.full-loading').textContent='一期完整 Demo 加载失败，请刷新后重试。'}}
const moduleMeta={coupon:'优惠券配置',shelf:'课程上下架',price:'商品调价',taxonomy:'全业务线总览',clinical:'临床商品清单'};
const moduleStyle=document.createElement('style');moduleStyle.textContent='.nav a,.nav button{width:100%;min-height:42px;padding:10px 12px;border:0;border-radius:8px;color:var(--muted);background:transparent;text-align:left;text-decoration:none;font-weight:600}.nav button:hover{background:#f0f2f4}.nav-group{margin:18px 10px 6px;color:#8a919e;font-size:12px;font-weight:700}.module-main{max-width:none;padding:0;background:#fff}.module-head{height:64px;padding:0 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.module-head h1{margin:0;font-size:18px}.module-head p{margin:0;color:var(--muted);font-size:12px}.module-frame{display:block;width:100%;height:calc(100vh - 129px);border:0;background:#fff}.module-loading{display:grid;place-items:center;height:calc(100vh - 129px);color:var(--muted)}';document.head.appendChild(moduleStyle);
const workspace=document.querySelector('main');workspace.id='workspace';
const nav=document.querySelector('.nav');nav.insertAdjacentHTML('beforeend','<div class="nav-group">一期完整业务能力</div>'+Object.entries(moduleMeta).map(([key,label])=>'<button type="button" data-module="'+key+'">'+label+'</button>').join(''));
async function openModule(key){const label=moduleMeta[key];if(!label)return;nav.querySelectorAll('a,button').forEach(x=>x.classList.toggle('active',x.dataset.module===key));workspace.className='module-main';workspace.innerHTML='<div class="module-head"><div><h1>'+label+'</h1><p>一期已整理完整功能，可直接操作查看</p></div><button class="btn" style="margin-left:auto" onclick="location.reload()">返回优惠券任务管理</button></div><div class="module-loading">正在加载'+label+'…</div>';try{const source=await fetch('/coupon-source.html').then(r=>{if(!r.ok)throw new Error('source');return r.text()}),pattern=new RegExp('["\\\']?'+key+'["\\\']?\\s*:\\s*["\\\']([A-Za-z0-9+/=]+)["\\\']'),match=source.match(pattern);if(!match)throw new Error('module');const bytes=Uint8Array.from(atob(match[1]),c=>c.charCodeAt(0)),html=new TextDecoder().decode(bytes),frame=document.createElement('iframe');frame.className='module-frame';frame.title=label;frame.srcdoc=html;document.querySelector('.module-loading').replaceWith(frame)}catch(err){document.querySelector('.module-loading').innerHTML='加载失败，请刷新页面后重试。'}}
nav.addEventListener('click',e=>{const button=e.target.closest('[data-module]');if(!button)return;e.preventDefault();e.stopPropagation();openModule(button.dataset.module)},true);
