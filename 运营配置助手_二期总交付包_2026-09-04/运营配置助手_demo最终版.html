<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营配置助手 · 总览演示</title>
<style>
  :root{
    --jade:#1F8A6E;
    --jade-dark:#166350;
    --jade-tint:#E4F2EC;
    --text:#2B2B2B;
    --muted:#8A8A8A;
    --line:#E3E3E3;
    --brand:#D7000F;
    --brand-dark:#A3000C;
    --brand-tint:#FBE7E8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#EDEFEF;color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  .top-bar{
    background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;
    display:flex;align-items:center;gap:16px;flex-shrink:0;flex-wrap:wrap;
  }
  .brand-header{display:flex;align-items:center;gap:10px;}
  .brand-header img{height:28px;display:block;}
  .brand-header .sep{width:1px;height:18px;background:var(--line);}
  .brand-header .page-name{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;}

  .tab-bar{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
  .tab-btn{
    padding:9px 16px;border-radius:8px;border:1.5px solid var(--line);background:#FAFAFA;
    font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .tab-btn:hover{border-color:var(--jade);color:var(--jade-dark);}
  .tab-btn.active{background:var(--jade);border-color:var(--jade);color:#fff;}

  .stage{flex:1;overflow:hidden;position:relative;background:#EDEFEF;}
  .stage iframe{width:100%;height:100%;border:none;display:block;background:#fff;}
  .loading-hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--muted);background:#EDEFEF;
  }
</style>
</head>

const iframe = document.getElementById('stageFrame');
const loadingHint = document.getElementById('loadingHint');

function showTab(key){
  loadingHint.style.display = 'flex';
  iframe.style.visibility = 'hidden';
  iframe.src = 'data:text/html;base64,' + demoData[key];
  iframe.onload = () => {
    loadingHint.style.display = 'none';
    iframe.style.visibility = 'visible';
  };
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    showTab(btn.dataset.key);
  });
});

showTab('coupon');
</script>
